[project]
name = "docusky-mcp"
version = "0.1.0"
description = "MCP server for DocuSky (數位人文學術研究平台) — query DocuSky databases from Claude, Gemini, or any MCP client."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.scripts]
docusky-mcp = "docusky_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docusky_mcp"]
